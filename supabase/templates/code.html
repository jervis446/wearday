<div style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#2A2420">
  <h2 style="margin:0 0 12px">Your Wearday sign-in code</h2>
  <p style="margin:0 0 16px">On your phone, tap the button to sign in:</p>
  <p style="margin:0 0 20px"><a href="{{ .ConfirmationURL }}" style="background:#C2603E;color:#fff;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:700">Sign in to Wearday</a></p>
  <p style="margin:0 0 8px">Or enter this code in the app:</p>
  <p style="font-size:32px;font-weight:800;letter-spacing:6px;margin:0 0 16px;color:#C2603E">{{ .Token }}</p>
  <p style="margin:0;color:#8C8279;font-size:13px">It expires in one hour. If you didn't ask for this, you can ignore this email.</p>
</div>
